{{- /*
what the API needs and must not have in a ConfigMap: the master key (when given
as a value), the database password, the connection strings that carry it.
generated values are kept across upgrades with `lookup`, so a `helm upgrade`
does not change the password the running database was initialised with.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "syncle.envSecret" .)) -}}
{{- $existingData := ternary $existing.data (dict) (not (empty $existing)) -}}
{{- $pgPassword := .Values.postgres.password -}}
{{- if and (not $pgPassword) (hasKey $existingData "POSTGRES_PASSWORD") -}}
{{- $pgPassword = (index $existingData "POSTGRES_PASSWORD" | b64dec) -}}
{{- else if not $pgPassword -}}
{{- $pgPassword = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncle.envSecret" . }}
  labels:
    {{- include "syncle.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.masterKey.value (not .Values.masterKey.existingSecret) }}
  SYNCLE_MASTER_KEY: {{ .Values.masterKey.value | quote }}
  {{- end }}
  {{- if .Values.masterKey.previous }}
  SYNCLE_MASTER_KEY_PREVIOUS: {{ .Values.masterKey.previous | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s?schema=public" .Values.postgres.user $pgPassword (include "syncle.postgresHost" .) .Values.postgres.database | quote }}
  {{- else if .Values.postgres.external.url }}
  DATABASE_URL: {{ .Values.postgres.external.url | quote }}
  {{- else if not .Values.postgres.external.existingSecret }}
  {{- fail "postgres.enabled is false: set postgres.external.url or postgres.external.existingSecret" }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "syncle.redisHost" .) | quote }}
  {{- else if .Values.redis.external.url }}
  REDIS_URL: {{ .Values.redis.external.url | quote }}
  {{- else if not .Values.redis.external.existingSecret }}
  {{- fail "redis.enabled is false: set redis.external.url or redis.external.existingSecret" }}
  {{- end }}
  {{- if .Values.api.metricsToken }}
  SYNCLE_METRICS_TOKEN: {{ .Values.api.metricsToken | quote }}
  {{- end }}
