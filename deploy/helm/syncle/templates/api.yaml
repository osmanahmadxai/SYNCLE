{{- $origin := include "syncle.webOrigin" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncle.fullname" . }}-api
  labels:
    {{- include "syncle.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "syncle.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "syncle.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # a changed key or connection string reaches the pods on upgrade
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.postgres.enabled .Values.redis.enabled }}
      # the metadata store and the queue come up in this same release: wait for
      # them rather than crash-loop through `prisma migrate deploy`
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "syncle.postgresHost" . }} 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "syncle.redisHost" . }} 6379; do echo waiting for redis; sleep 2; done']
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "syncle.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/apps/api
          # apply the migrations, then serve (more than one replica: the
          # migrations are idempotent and locked, the second waits for the first)
          command: ['sh', '-c', 'npx prisma migrate deploy && node dist/main.js']
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4002'
            - name: SYNCLE_DATA_DIR
              value: /app/apps/api/.syncle
            - name: SYNCLE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "syncle.masterKeyRef" . | nindent 18 }}
            {{- if .Values.masterKey.previous }}
            - name: SYNCLE_MASTER_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncle.envSecret" . }}
                  key: SYNCLE_MASTER_KEY_PREVIOUS
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if and (not .Values.postgres.enabled) .Values.postgres.external.existingSecret }}
                  name: {{ .Values.postgres.external.existingSecret }}
                  key: {{ .Values.postgres.external.key }}
                  {{- else }}
                  name: {{ include "syncle.envSecret" . }}
                  key: DATABASE_URL
                  {{- end }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  {{- if and (not .Values.redis.enabled) .Values.redis.external.existingSecret }}
                  name: {{ .Values.redis.external.existingSecret }}
                  key: {{ .Values.redis.external.key }}
                  {{- else }}
                  name: {{ include "syncle.envSecret" . }}
                  key: REDIS_URL
                  {{- end }}
            {{- if .Values.api.metricsToken }}
            - name: SYNCLE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncle.envSecret" . }}
                  key: SYNCLE_METRICS_TOKEN
            {{- end }}
            {{- if $origin }}
            - name: WEB_ORIGIN
              value: {{ $origin | quote }}
            {{- end }}
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/apps/api/.syncle
      volumes:
        - name: data
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "syncle.fullname" . }}-api-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncle.fullname" . }}-api
  labels:
    {{- include "syncle.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "syncle.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4002
      targetPort: http
{{- if .Values.api.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "syncle.fullname" . }}-api-data
  labels:
    {{- include "syncle.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    {{- toYaml .Values.api.persistence.accessModes | nindent 4 }}
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
{{- end }}
