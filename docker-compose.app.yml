# Full, self-contained Syncle stack: web GUI + API + Postgres + Redis.
# Everything runs in containers — a fresh machine needs only Docker.
#
#   syncle up                                          # start everything, open the GUI
#   docker compose -f docker-compose.app.yml up -d     # (equivalent)
#
# The app image is pulled from GHCR, so there is nothing to build: first run is
# a download, not a compile. To build it yourself from this checkout instead:
#
#   docker compose -f docker-compose.app.yml --profile build build
#   SYNCLE_IMAGE=syncle-app:local docker compose -f docker-compose.app.yml up -d
#
# For local development against host-run services, use docker-compose.yml
# (Postgres + Redis only) plus `pnpm dev` instead.
name: syncle

# Pin a version with SYNCLE_IMAGE=ghcr.io/osmanahmadxai/syncle:v1.2.3
x-app-image: &app-image ${SYNCLE_IMAGE:-ghcr.io/osmanahmadxai/syncle:latest}

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncle
    volumes:
      - syncle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d syncle']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncle-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - syncle-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: *app-image
    container_name: syncle-api
    restart: unless-stopped
    working_dir: /app/apps/api
    # Apply DB migrations, then start the API.
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/main.js']
    environment:
      NODE_ENV: production
      PORT: '4002'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syncle?schema=public
      REDIS_URL: redis://redis:6379
      # ⚠ SET THIS. Encrypts stored connection credentials and signs session
      # cookies. Generate one with `openssl rand -base64 32` and export it
      # before `docker compose up`. Left empty, the API auto-generates a key
      # inside the data volume — i.e. stored right next to the data it
      # protects, and lost with it if the volume is removed.
      SYNCLE_MASTER_KEY: ${SYNCLE_MASTER_KEY:-}
      # Persist local state (and the auto-generated key, if you skipped setting
      # one) in a named volume so stored credentials and sessions survive
      # restarts.
      SYNCLE_DATA_DIR: /app/apps/api/.syncle
    volumes:
      - syncle-api-data:/app/apps/api/.syncle
    # Not published: the browser reaches the API through the web app's /api
    # proxy, so only one port needs to be open. Uncomment to call it directly.
    # ports:
    #   - '4002:4002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4002/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: *app-image
    container_name: syncle-web
    restart: unless-stopped
    working_dir: /app/web/apps/web
    # the Next standalone server produced by the image's build stage
    command: ['node', 'server.js']
    environment:
      NODE_ENV: production
      PORT: '3002'
      HOSTNAME: 0.0.0.0
      # Where the web server forwards /api to, over the compose network. The
      # browser only ever sees this app's own origin, which is what lets the
      # same image serve localhost, a LAN address or a reverse-proxied domain.
      SYNCLE_API_ORIGIN: http://api:4002
    ports:
      - '${SYNCLE_PORT:-3002}:3002'
    depends_on:
      api:
        condition: service_healthy

  # Opt-in builder: `docker compose --profile build build` produces
  # syncle-app:local from this checkout. Not started, never pulled.
  build:
    profiles: ['build']
    image: syncle-app:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ['true']

volumes:
  syncle-postgres-data:
  syncle-redis-data:
  syncle-api-data:
