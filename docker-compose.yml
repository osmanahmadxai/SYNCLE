# Local infrastructure for Syncle.
#
#   docker compose up -d           # start postgres + redis
#
# - postgres backs Syncle's OWN metadata store (saved connections, bridges, jobs,
#   deliveries) via Prisma — see apps/api/.env DATABASE_URL.
# - redis backs the BullMQ queue that executes bridge jobs durably (jobs survive
#   an API restart and auto-resume). The database studio, bridge CRUD and payload
#   preview do not need Redis — only *running* a job does.
services:
  postgres:
    image: postgres:16-alpine
    container_name: syncle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncle
    ports:
      # Host 5433 avoids clashing with any local/other Postgres on 5432.
      # Bound to loopback so the metadata store is never exposed on the LAN.
      - '127.0.0.1:5433:5432'
    volumes:
      - syncle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d syncle']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncle-redis
    restart: unless-stopped
    ports:
      # Loopback-only, same reasoning as postgres above.
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - syncle-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  syncle-postgres-data:
  syncle-redis-data:
